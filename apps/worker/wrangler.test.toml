# Test-only config: same binding NAMES as wrangler.toml, no assets/AI/ratelimit (injected by tests).
name = "the-newsroom-test"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "test-db"
database_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "SESSIONS"
id = "sessions-test"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "media-test"
